<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Twittly</title>
    <link rel="stylesheet" href="loginStyle.css">
</head>

<body>

    <div class="login-container">

        <!-- Twitter Logo -->
        <div class="twitter-logo">
            <span>
                <img src="images/logo.png" alt="Twittly Logo" class="logo">
            </span>
        </div>

        <h1>Log in to Twittly</h1>

        <!-- Login Form -->
        <form>

            <input
                type="text"
                placeholder="Phone, email, or username"
            >

            <input
                type="password"
                placeholder="Password"
            >

            <button type="submit">
                Log in
            </button>

        </form>

        <!-- Links -->
        <div class="links">
            <a href="#">Forgot password?</a>
            <span>•</span>
            <a href="#">Sign up for Twittly</a>
        </div>

    </div>

</body>
</html>
